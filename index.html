<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شاركنا رأيك</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dff6ff, #f5e9ff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: min(900px, 100%);
      aspect-ratio: 16 / 9;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 25px;
      font-size: clamp(26px, 5vw, 48px);
    }

    .cloud {
      position: relative;
      width: min(650px, 90vw);
      min-height: 300px;
      background: white;
      border-radius: 120px;
      padding: 55px 45px 40px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 50%;
      z-index: -1;
    }

    .cloud::before {
      width: 180px;
      height: 180px;
      top: -70px;
      right: 100px;
    }

    .cloud::after {
      width: 140px;
      height: 140px;
      top: -45px;
      left: 120px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 2px solid #e3e3e3;
      border-radius: 20px;
      padding: 18px;
      font-size: 18px;
      font-family: inherit;
      outline: none;
      text-align: right;
    }

    textarea:focus {
      border-color: #8b7cff;
    }

    button {
      margin-top: 18px;
      border: none;
      border-radius: 30px;
      padding: 14px 35px;
      font-size: 18px;
      font-family: inherit;
      cursor: pointer;
      background: #6c63ff;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.04);
    }

    #message {
      margin-top: 15px;
      color: #555;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      .container {
        aspect-ratio: auto;
        min-height: 100vh;
      }

      .cloud {
        padding: 45px 20px 30px;
        min-height: 320px;
      }

      textarea {
        min-height: 140px;
      }
    }
  </style>
